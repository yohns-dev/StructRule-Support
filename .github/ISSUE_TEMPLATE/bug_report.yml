name: 문제 신고
description: StructRule에서 발생한 오류나 예상과 다른 동작을 알려주세요.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 공개 글에 개인정보, 민감한 파일 내용 또는 전체 사용자 경로를 포함하지 마세요.
  - type: input
    id: operating-system
    attributes:
      label: 운영체제와 버전
      placeholder: 예) macOS 15.5 또는 Windows 11 24H2
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: StructRule 버전
      placeholder: 예) 1.0.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 문제가 발생하기까지의 순서를 적어주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
    validations:
      required: true
