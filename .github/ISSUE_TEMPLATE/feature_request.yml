name: 기능 제안 (한국어)
description: StructRule를 더 편리하게 만들 아이디어를 제안해 주세요.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하고 싶은 문제
      description: 현재 어떤 점이 불편한지 알려주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 기능
      description: 원하는 동작을 간단히 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 참고 사항
      description: 고려한 다른 방법이나 참고 자료가 있다면 적어주세요.
