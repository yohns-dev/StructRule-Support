name: Report a problem (English)
description: Let us know about an error or unexpected behavior in StructRule.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include personal information, sensitive file contents, or full local paths in a public issue.
  - type: input
    id: operating-system
    attributes:
      label: Operating system and version
      placeholder: e.g. macOS 15.5 or Windows 11 24H2
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: StructRule version
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the steps that led to the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe how StructRule should have behaved.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe what happened instead.
    validations:
      required: true
