<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="StructRule 공식 지원 및 개인정보 처리 안내" data-ko="StructRule 공식 지원 및 개인정보 처리 안내" data-en="Official StructRule support and privacy information">
  <title>StructRule</title>
  <style>
    :root { color-scheme:light dark; --blue:#1684f8; --green:#32c75a; --orange:#ff9500; --bg:#f5f6f8; --card:#fff; --text:#202124; --muted:#62666d; --line:#d9dce1; }
    @media (prefers-color-scheme:dark) { :root { --bg:#18191b; --card:#24262a; --text:#f2f3f5; --muted:#b5b8bf; --line:#3a3d42; } }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--text); background:var(--bg); line-height:1.6; }
    main { width:min(760px,calc(100% - 40px)); margin:0 auto; padding:80px 0; }
    .mark { display:grid; grid-template-columns:repeat(3,16px); gap:5px; width:max-content; margin-bottom:28px; }
    .mark span { width:16px; height:16px; background:var(--blue); border-radius:3px; }
    .mark .rule { background:var(--orange); } .mark .pass { background:var(--green); }
    h1 { margin:0; font-size:clamp(42px,8vw,72px); letter-spacing:-.05em; }
    .lead { max-width:620px; margin:14px 0 36px; color:var(--muted); font-size:20px; }
    .links { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; }
    a.card { display:block; padding:22px; color:inherit; text-decoration:none; background:var(--card); border:1px solid var(--line); border-radius:18px; transition:transform .15s ease,border-color .15s ease; }
    a.card:hover { transform:translateY(-2px); border-color:var(--blue); }
    .card strong { display:block; margin-bottom:5px; font-size:17px; }
    .card span { color:var(--muted); font-size:14px; }
    footer { margin-top:48px; color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"><span></span><span></span><span class="rule"></span><span></span><span class="pass"></span><span></span></div>
    <h1>StructRule</h1>
    <p class="lead" data-ko="폴더 구조와 이름 규칙을 설계하고, 선택한 프로젝트의 규칙 위반을 확인하세요." data-en="Define folder structures and naming rules, then check selected projects for rule violations.">폴더 구조와 이름 규칙을 설계하고, 선택한 프로젝트의 규칙 위반을 확인하세요.</p>
    <section class="links" aria-label="지원 링크" data-aria-ko="지원 링크" data-aria-en="Support links">
      <a class="card" href="https://github.com/yohns-dev/StructRule-Support/blob/main/PRIVACY.md" data-href-ko="https://github.com/yohns-dev/StructRule-Support/blob/main/PRIVACY.md" data-href-en="https://github.com/yohns-dev/StructRule-Support/blob/main/PRIVACY_EN.md"><strong data-ko="개인정보 처리방침" data-en="Privacy Policy">개인정보 처리방침</strong><span data-ko="데이터 접근과 처리 방식을 확인합니다." data-en="Learn how StructRule accesses and handles data.">데이터 접근과 처리 방식을 확인합니다.</span></a>
      <a class="card" href="https://github.com/yohns-dev/StructRule-Support/blob/main/SUPPORT.md" data-href-ko="https://github.com/yohns-dev/StructRule-Support/blob/main/SUPPORT.md" data-href-en="https://github.com/yohns-dev/StructRule-Support/blob/main/SUPPORT_EN.md"><strong data-ko="고객 지원" data-en="Support">고객 지원</strong><span data-ko="사용 방법과 문의 안내를 확인합니다." data-en="Find help and contact information.">사용 방법과 문의 안내를 확인합니다.</span></a>
      <a class="card" href="mailto:structrule.support@gmail.com"><strong data-ko="이메일 문의" data-en="Email Support">이메일 문의</strong><span data-ko="공개하기 어려운 문의를 이메일로 보내세요." data-en="Send questions that should not be posted publicly.">공개하기 어려운 문의를 이메일로 보내세요.</span></a>
      <a class="card" href="https://github.com/yohns-dev/StructRule-Support/issues"><strong data-ko="문의 및 제안" data-en="Issues & Feedback">문의 및 제안</strong><span data-ko="문제를 신고하거나 기능을 제안합니다." data-en="Report a problem or suggest a feature.">문제를 신고하거나 기능을 제안합니다.</span></a>
    </section>
    <footer data-ko="© 2026 StructRule. 이 사이트는 지원 및 정책 정보만 제공합니다." data-en="© 2026 StructRule. This site contains support and policy information only.">© 2026 StructRule. 이 사이트는 지원 및 정책 정보만 제공합니다.</footer>
  </main>
  <script>
    const preferredLanguage = navigator.languages?.[0] ?? navigator.language ?? "en";
    const language = preferredLanguage.toLowerCase().startsWith("ko") ? "ko" : "en";
    document.documentElement.lang = language;
    document.querySelectorAll("[data-ko][data-en]").forEach(element => {
      if (element instanceof HTMLMetaElement) {
        element.content = element.dataset[language];
      } else {
        element.textContent = element.dataset[language];
      }
    });
    document.querySelectorAll("[data-aria-ko][data-aria-en]").forEach(element => {
      element.setAttribute("aria-label", element.dataset[`aria${language === "ko" ? "Ko" : "En"}`]);
    });
    document.querySelectorAll("[data-href-ko][data-href-en]").forEach(element => {
      element.href = element.dataset[`href${language === "ko" ? "Ko" : "En"}`];
    });
  </script>
</body>
</html>
